apiVersion: 1

datasources:
  - name: ReductStore Cloud
    type: reductstore-datasource
    uid: reductstore-cloud
    isDefault: true
    jsonData:
      serverURL: http://cloud:8383
    secureJsonData:
      serverToken: grafana
  - name: ReductStore Edge
    type: reductstore-datasource
    uid: reductstore-edge
    jsonData:
      serverURL: http://edge:8383
    secureJsonData:
      serverToken: edge
