name: ${PROJECT_NAME:-ros-reductstore-demo}

networks:
  reductnet:
    name: ${NETWORK_NAME:-reductnet}
    driver: bridge

volumes:
  grafana-data:
  edge-data:
  cloud-data:

services:

  # =========================
  # Traefik reverse proxy
  # =========================
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    networks: [reductnet]
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro

  # =========================
  # Cloud ReductStore (aggregator)
  # Receives replicated data from the robot.
  # =========================
  cloud:
    image: ${REDUCT_IMAGE:-reduct/store:latest}
    container_name: cloud
    restart: unless-stopped
    networks: [reductnet]
    environment:
      RS_HOST: 0.0.0.0
      RS_PORT: 8383
      RS_API_BASE_PATH: /
      RS_PUBLIC_URL: "http://cloud.reduct.demo/"
      RS_CORS_ALLOW_ORIGIN: "*"
      RS_DATA_PATH: /data
      RS_API_TOKEN: ${CLOUD_API_TOKEN:-cloud}
      RS_LICENSE_PATH: /licenses/reduct.lic
      RS_BUCKET_ROBOT_NAME: robot
      RS_BUCKET_ROBOT_QUOTA_TYPE: FIFO
      RS_BUCKET_ROBOT_QUOTA_SIZE: 20Gb
      RS_TOKEN_GRAFANA_NAME: grafana
      RS_TOKEN_GRAFANA_VALUE: ${GRAFANA_READ_TOKEN:-grafana}
      RS_TOKEN_GRAFANA_READ: robot
    volumes:
      - cloud-data:/data
      - ${HOST_LICENSE_PATH:-./licenses/reduct.lic}:/licenses/reduct.lic:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloud.rule=Host(`cloud.reduct.demo`)"
      - "traefik.http.routers.cloud.entrypoints=web"
      - "traefik.http.services.cloud.loadbalancer.server.port=8383"

  # =========================
  # Edge ReductStore (simulated robot)
  # Ingests from ReductBridge, replicates filtered data to cloud.
  # =========================
  edge:
    image: ${REDUCT_IMAGE:-reduct/store:latest}
    container_name: edge
    restart: unless-stopped
    networks: [reductnet]
    environment:
      RS_HOST: 0.0.0.0
      RS_PORT: 8383
      RS_PUBLIC_URL: "http://edge.reduct.demo/"
      RS_CORS_ALLOW_ORIGIN: "*"
      RS_DATA_PATH: /data
      RS_API_TOKEN: ${EDGE_API_TOKEN:-edge}
      RS_LICENSE_PATH: /licenses/reduct.lic
      RS_BUCKET_ROBOT_NAME: robot
      RS_BUCKET_ROBOT_QUOTA_TYPE: FIFO
      RS_BUCKET_ROBOT_QUOTA_SIZE: 10Gb

      # --- R1: downsample images to 1 fps ---
      RS_REPLICATION_R1_NAME: robot-image-1fps
      RS_REPLICATION_R1_SRC_BUCKET: robot
      RS_REPLICATION_R1_DST_BUCKET: robot
      RS_REPLICATION_R1_DST_HOST: "http://cloud:8383"
      RS_REPLICATION_R1_DST_TOKEN: ${CLOUD_API_TOKEN:-cloud}
      RS_REPLICATION_R1_ENTRIES: image
      RS_REPLICATION_R1_WHEN: >
        {
          "$$each_t": "1s"
        }

      # --- R2: medium severity (whole bucket, no context) ---
      RS_REPLICATION_R2_NAME: robot-medium
      RS_REPLICATION_R2_SRC_BUCKET: robot
      RS_REPLICATION_R2_DST_BUCKET: robot
      RS_REPLICATION_R2_DST_HOST: "http://cloud:8383"
      RS_REPLICATION_R2_DST_TOKEN: ${CLOUD_API_TOKEN:-cloud}
      RS_REPLICATION_R2_WHEN: >
        {
          "$$or": [
            { "$$and": [ { "$$gte": ["&event_severity", 4] }, { "$$lte": ["&event_severity", 7] } ] },
            { "&obstacle_dist_cm":  { "$$lte": 100 } },
            { "&battery_pct":       { "$$lte": 30 } },
            { "&cpu_temp_c":        { "$$gte": 75 } }
          ]
        }

      # --- R3: high severity (whole bucket, 5 min of pre-context) ---
      RS_REPLICATION_R3_NAME: robot-high
      RS_REPLICATION_R3_SRC_BUCKET: robot
      RS_REPLICATION_R3_DST_BUCKET: robot
      RS_REPLICATION_R3_DST_HOST: "http://cloud:8383"
      RS_REPLICATION_R3_DST_TOKEN: ${CLOUD_API_TOKEN:-cloud}
      RS_REPLICATION_R3_WHEN: >
        {
          "$$or": [
            { "&event_severity":    { "$$gte": 8 } },
            { "&obstacle_dist_cm":  { "$$lte": 30 } },
            { "&battery_pct":       { "$$lte": 18 } },
            { "&cpu_temp_c":        { "$$gte": 82 } }
          ],
          "#ctx_before": "5m"
        }

      # --- R4: telemetry (imu, tf, diagnostics) at 1 Hz ---
      RS_REPLICATION_R4_NAME: robot-telemetry
      RS_REPLICATION_R4_SRC_BUCKET: robot
      RS_REPLICATION_R4_DST_BUCKET: robot
      RS_REPLICATION_R4_DST_HOST: "http://cloud:8383"
      RS_REPLICATION_R4_DST_TOKEN: ${CLOUD_API_TOKEN:-cloud}
      RS_REPLICATION_R4_ENTRIES: imu,tf,diagnostics
      RS_REPLICATION_R4_WHEN: >
        {
          "$$each_t": "1s"
        }
    volumes:
      - edge-data:/data
      - ${HOST_LICENSE_PATH:-./licenses/reduct.lic}:/licenses/reduct.lic:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edge.rule=Host(`edge.reduct.demo`)"
      - "traefik.http.routers.edge.entrypoints=web"
      - "traefik.http.services.edge.loadbalancer.server.port=8383"

  # =========================
  # Robot: ROS 2 player + ReductBridge
  # Plays an MCAP file onto ROS 2 topics; ReductBridge subscribes
  # and writes records to the edge ReductStore.
  # =========================
  robot:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: robot
    restart: unless-stopped
    networks: [reductnet]
    environment:
      ROS_DOMAIN_ID: 0
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      EDGE_URL: "http://edge:8383"
      EDGE_API_TOKEN: ${EDGE_API_TOKEN:-edge}
      MCAP_FILE: /data/example-010-amr.mcap
    volumes:
      - ./data:/data:ro
      - ./config/reduct-bridge.toml:/config/reduct-bridge.toml:ro
    depends_on:
      - edge

  # =========================
  # Grafana (cloud dashboards)
  # =========================
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: grafana
    restart: unless-stopped
    networks: [reductnet]
    depends_on: [cloud]
    environment:
      GF_PLUGINS_PREINSTALL: "reductstore-datasource@@https://github.com/reductstore/reduct-grafana/releases/download/${GRAFANA_REDUCT_TAG:-v1.1.0}/reductstore-datasource-${GRAFANA_REDUCT_VERSION:-1.1.0}.zip"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "reductstore-datasource"
      GF_SERVER_ROOT_URL: "http://grafana.reduct.demo"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.reduct.demo`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # =========================
  # Lichtblick (Foxglove Studio fork, visualization)
  # =========================
  foxglove:
    image: ${FOXGLOVE_IMAGE:-ghcr.io/lichtblick-suite/lichtblick:latest}
    container_name: foxglove
    restart: unless-stopped
    networks: [reductnet]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.foxglove.rule=Host(`foxglove.reduct.demo`)"
      - "traefik.http.routers.foxglove.entrypoints=web"
      - "traefik.http.services.foxglove.loadbalancer.server.port=8080"
